[package]
name = "audio-sharing"
version = "0.0.0"
authors = ["Felix Häcker <haeckerfelix@gnome.org>"]
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
log = "0.4"
pretty_env_logger = "0.4"
regex = "1.4"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk-macros = "0.3"
once_cell = "1.5"
adw = { version = "0.2.0-alpha.3", package = "libadwaita", features = ["v1_2"] }
gstreamer = "0.18"
gstreamer-rtsp-server = "0.18"
gtk = { version = "0.4.6", package = "gtk4" }
qrcode = "0.12"
pnet = "0.28"
