[package]
name = "audio-sharing"
version = "0.1.0"
authors = ["Felix Häcker <haeckerfelix@gnome.org>"]
edition = "2018"

[dependencies]
log = "0.4"
pretty_env_logger = "0.4"
regex = "1.4.3"
gettext-rs = { version = "0.6", features = ["gettext-system"] }
gtk-macros = "0.3"
once_cell = "1.5"
adw = { git = "https://gitlab.gnome.org/bilelmoussaoui/libadwaita-rs", package = "libadwaita" }
gstreamer = { git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs" }
gstreamer-rtsp-server = { git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs" }
gtk = { git = "https://github.com/gtk-rs/gtk4-rs", package = "gtk4" }
qrcode = "0.12"
